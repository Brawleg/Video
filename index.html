<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеочат</title>
    <style>
        body { font-family: Arial; text-align: center; background: #1a1a2e; color: white; padding: 10px; }
        video { width: 100%; max-width: 300px; background: #000; border-radius: 10px; margin: 10px; }
        .videos { display: flex; flex-wrap: wrap; justify-content: center; }
        .controls { margin: 15px; }
        input, button { padding: 10px; margin: 5px; border-radius: 8px; border: none; }
        button { background: #e94560; color: white; font-weight: bold; cursor: pointer; }
        #status { margin: 10px; padding: 8px; background: #16213e; border-radius: 20px; }
        #logs { font-size: 12px; color: #aaa; max-height: 150px; overflow-y: auto; text-align: left; background: #0f0f1f; padding: 10px; border-radius: 8px; margin: 10px; }
    </style>
</head>
<body>
    <h1>📹 Видеочат</h1>
    <div class="controls">
        <input type="text" id="room" value="myroom" placeholder="Комната">
        <button id="join">Войти</button>
        <button id="leave" disabled>Выйти</button>
    </div>
    <div class="videos">
        <div><video id="local" autoplay muted playsinline></video><p>Вы</p></div>
        <div><video id="remote" autoplay playsinline></video><p>Собеседник</p></div>
    </div>
    <div id="status">Ожидание...</div>
    <div id="logs"></div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script>
        // ========== ВСТАВЬТЕ ВАШИ НАСТРОЙКИ FIREBASE ==========
        const firebaseConfig = {
            apiKey: "ВАШ_API_KEY",
            authDomain: "ratka-ad3c4.firebaseapp.com",
            databaseURL: "https://ratka-ad3c4-default-rtdb.firebaseio.com/",
            projectId: "ratka-ad3c4",
            storageBucket: "ratka-ad3c4.appspot.com",
            messagingSenderId: "ваш_sender_id",
            appId: "ваш_app_id"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        // ====================================================
                // DOM-элементы
        const localVideo = document.getElementById('local');
        const remoteVideo = document.getElementById('remote');
        const roomInput = document.getElementById('room');
        const joinBtn = document.getElementById('join');
        const leaveBtn = document.getElementById('leave');
        const statusDiv = document.getElementById('status');
        const logsDiv = document.getElementById('logs');

        function log(msg) {
            const p = document.createElement('div');
            p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logsDiv.appendChild(p);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }
        function setStatus(text, err = false) {
            statusDiv.textContent = text;
            statusDiv.style.color = err ? '#ff6b6b' : '#51cf66';
        }

        let localStream, pc, roomRef, isCaller = false;

        // Более мощные STUN/TURN (добавлен TURN от Google, но лучше заменить на свой)
        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                // TURN от Google (ограниченно, но хоть что-то)
                { urls: 'turn:turn.l.google.com:19305?transport=udp', credential: 'webrtc', username: 'webrtc' }
            ]
        };

        async function getMedia() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = stream;
                localStream = stream;
                log('✅ Камера и микрофон включены');
                return stream;
            } catch (e) {
                log('❌ Нет доступа: ' + e.message);
                setStatus('Нет доступа к камере/микрофону', true);
                throw e;
            }
        }

        function createPeer() {
            const pc = new RTCPeerConnection(rtcConfig);
            if (localStream) {
                localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            }
            pc.ontrack = (e) => {
                if (e.streams.length) {
                    remoteVideo.srcObject = e.streams[0];
                    log('📡 Удалённое видео получено!');
                    setStatus('✅ Соединение установлено!');
                }
            };
            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    sendSignal({ type: 'candidate', candidate: e.candidate });
                }
            };
            pc.oniceconnectionstatechange = () => {
                log('🧊 ICE состояние: ' + pc.iceConnectionState);
                if (pc.iceConnectionState === 'failed') {
                    setStatus('❌ ICE failed (нет TURN?)', true);
                }
            };
            return pc;
        }

        function sendSignal(data) {
            if (roomRef) roomRef.child('signals').push(data);
        }

        function listenSignals() {
            roomRef.child('signals').on('child_added', async (snap) => {
                const data = snap.val();
                log(`📩 Получен ${data.type}`);
                if (data.type === 'offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    sendSignal({ type: 'answer', sdp: answer.sdp });
                } else if (data.type === 'answer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                } else if (data.type === 'candidate') {
                    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
                snap.ref.remove(); // удаляем после обработки
            });
        }

        async function joinRoom() {
            const roomName = roomInput.value.trim() || 'myroom';
            if (!roomName) return;

            try { await getMedia(); } catch { return; }

            pc = createPeer();
            roomRef = db.ref('rooms/' + roomName);

            // Очищаем старые сигналы
            await roomRef.child('signals').remove();

            // Слушаем сигналы ДО того, как станем caller'ом
            listenSignals();

            // Определяем caller'а через транзакцию
            const counterRef = roomRef.child('counter');
            counterRef.transaction((current) => (current || 0) + 1, (error, committed, snapshot) => {
                if (error) { log('Ошибка счётчика', true); return; }
                if (committed) {
                    const count = snapshot.val();
                    isCaller = (count === 1);
                    log(`👤 Вы участник #${count} (${isCaller ? 'инициатор' : 'приёмник'})`);
                    setStatus(`В комнате ${roomName}...`);

                    if (isCaller) {
                        // Создаём offer через 0.5 сек, чтобы второй точно успел подключиться
                        setTimeout(async () => {
                            const offer = await pc.createOffer();
                            await pc.setLocalDescription(offer);
                            sendSignal({ type: 'offer', sdp: offer.sdp });
                            log('📤 Offer отправлен');
                        }, 500);
                    }
                }
            });

            joinBtn.disabled = true;
            leaveBtn.disabled = false;
            roomInput.disabled = true;
        }

        function leaveRoom() {
            if (roomRef) {
                roomRef.child('signals').off();
                roomRef.child('counter').remove();
                roomRef = null;
            }
            if (pc) { pc.close(); pc = null; }
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
                localVideo.srcObject = null;
            }
            remoteVideo.srcObject = null;
            setStatus('Вы вышли');
            log('👋 Покинули комнату');
            joinBtn.disabled = false;
            leaveBtn.disabled = true;
            roomInput.disabled = false;
            isCaller = false;
        }

        joinBtn.onclick = joinRoom;
        leaveBtn.onclick = leaveRoom;
        window.onbeforeunload = leaveRoom;
        log('🚀 Приложение готово');
    </script>
</body>
</html>
